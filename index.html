<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>心情推薦歌曲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- 引導語 -->
    <div class="header-box">
        <h2>根據你的心情，推薦一首韓文歌給你 🎵</h2>
    </div>

    <!-- 今日心情 -->
    <div class="mood-box">
        <label>今日心情：</label>
        <select id="moodSelect">
            <option value="">--- 請選擇 ---</option>
            <option value="happy">開心</option>
            <option value="sad">難過</option>
            <option value="angry">生氣</option>
            <option value="relax">放鬆</option>
        </select>
    </div>

    <!-- 推薦按鈕 -->
    <button id="searchBtn" class="main-btn">推薦一首歌</button>

    <!-- MV 區 -->
    <div class="mv-box">
        <iframe id="ytPlayer" width="100%" height="350"
            src=""
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
    </div>

    <!-- 歌曲資訊 -->
    <div class="info-box">
        <h3 id="songTitle">歌曲資訊會顯示在這裡</h3>
        <p id="lyrics">等待你選擇心情～</p>
    </div>

    <!-- 換一首 -->
    <button id="changeSong" class="change-btn">換一首</button>

</div>

<script src="script.js"></script>
</body>
</html>
