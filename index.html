<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心情歌曲推薦</title>
    <style>
        body {
            font-family: Arial;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 30px;
        }
        .mood-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .mood-buttons button {
            padding: 10px 15px;
            border: 2px solid #000;
            background: #fff;
            cursor: pointer;
            border-radius: 10px;
        }
        .active-mood {
            background-color: #ffdcdc;
            border-color: #ff7070;
        }
        .mood-box {
            border: 2px solid #000;
            padding: 20px;
            width: 300px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        #recommendBtn {
            padding: 10px 20px;
            border: 2px solid #000;
            background: #fff;
            border-radius: 15px;
            cursor: pointer;
        }
        .video-box {
            width: 600px;
            height: 340px;
            border: 2px solid #000;
            margin-top: 30px;
            border-radius: 10px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .info-box {
            border: 2px solid #000;
            width: 280px;
            height: 120px;
            padding: 10px;
            border-radius: 10px;
        }
        #changeBtn {
            margin-top: 30px;
            padding: 12px 50px;
            border: 2px solid #000;
            border-radius: 30px;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>心情歌曲推薦</h1>

    <div class="mood-buttons">
        <button data-mood="happy">😊 開心 — 感覺今天很順利</button>
        <button data-mood="sad">😢 難過 — 想聽溫柔的安慰</button>
        <button data-mood="relax">😌 放鬆 — 想聽舒服悠閒的歌</button>
        <button data-mood="angry">😡 生氣 — 想釋放情緒</button>
        <button data-mood="stress">😖 壓力 — 想放空一下</button>
    </div>

    <div class="mood-box">
        今日心情：<span id="todayMood">未選擇</span>
    </div>

    <button id="recommendBtn">開始推薦</button>

    <div class="video-box">
        <iframe id="videoFrame" src=""></iframe>
    </div>

    <div class="info-row">
        <div class="info-box" id="songInfo">歌曲資訊將顯示於此</div>
        <div class="info-box" id="lyricBox">歌詞節錄將顯示於此</div>
    </div>

    <button id="changeBtn">換一首</button>

<script>
const moodButtons = document.querySelectorAll('.mood-buttons button');
const moodDisplay = document.getElementById('todayMood');
let currentMood = '';

moodButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        currentMood = btn.dataset.mood;
        moodDisplay.textContent = btn.textContent.split('—')[0].trim();

        moodButtons.forEach(b => b.classList.remove('active-mood'));
        btn.classList.add('active-mood');
    });
});

const songList = {
    happy: [
  {
    title: "Better Together",
    artist: "Jack Johnson",
    video: "https://www.youtube.com/embed/2v8YragSIuI",
    lyric: "溫暖輕快的旋律，讓人心情變好"
  },
  {
    title: "I'm Yours",
    artist: "Jason Mraz",
    video: "https://www.youtube.com/embed/EkHTsc9PU2A",
    lyric: "輕鬆愉快，充滿正能量的感覺"
  },
  {
    title: "Good Time",
    artist: "Owl City & Carly Rae Jepsen",
    video: "https://www.youtube.com/embed/H7HmzwI67ec",
    lyric: "適合放鬆、享受當下的快樂氛圍"
  }
],

    sad: [
  {
    title: "Someone Like You",
    artist: "Adele",
    video: "https://www.youtube.com/embed/hLQl3WQQoQ0",
    lyric: "情緒低落時的陪伴型歌曲"
  },
  {
    title: "Fix You",
    artist: "Coldplay",
    video: "https://www.youtube.com/embed/k4V3Mo61fJM",
    lyric: "溫柔安慰人心的旋律"
  },
  {
    title: "All I Want",
    artist: "Kodaline",
    video: "https://www.youtube.com/embed/mtf7hC17IBM",
    lyric: "適合靜靜聽、整理情緒"
  }
],

   relax: [
  {
    title: "Lofi Beats",
    artist: "Chillhop",
    video: "https://www.youtube.com/embed/5qap5aO4i9A",
    lyric: "適合讀書、放空、沉澱心情"
  },
  {
    title: "Weightless",
    artist: "Marconi Union",
    video: "https://www.youtube.com/embed/UfcAVejslrU",
    lyric: "節奏緩慢，讓人逐漸平靜"
  },
  {
    title: "River",
    artist: "Leon Bridges",
    video: "https://www.youtube.com/embed/0Hegd4xNfRo",
    lyric: "靜謐溫暖，帶點療癒感"
  }
],

   angry: [
  {
    title: "Numb",
    artist: "Linkin Park",
    video: "https://www.youtube.com/embed/kXYiU_JCYtU",
    lyric: "釋放壓抑情緒的代表歌曲"
  },
  {
    title: "Believer",
    artist: "Imagine Dragons",
    video: "https://www.youtube.com/embed/7wtfhZwyrcc",
    lyric: "把憤怒轉為力量"
  },
  {
    title: "Smells Like Teen Spirit",
    artist: "Nirvana",
    video: "https://www.youtube.com/embed/hTWKbfoikeg",
    lyric: "搖滾能量，宣洩情緒"
  }
],

    stress: [
  {
    title: "Let It Be",
    artist: "The Beatles",
    video: "https://www.youtube.com/embed/QDYfEBY9NM4",
    lyric: "提醒自己慢下來"
  },
  {
    title: "Breathe",
    artist: "Télépopmusik",
    video: "https://www.youtube.com/embed/vyut3GyQtn0",
    lyric: "適合深呼吸、放鬆"
  },
  {
    title: "Holocene",
    artist: "Bon Iver",
    video: "https://www.youtube.com/embed/TWcyIpul8OE",
    lyric: "讓人沉靜、整理思緒"
  }
]

};

const recommendBtn = document.getElementById('recommendBtn');
recommendBtn.addEventListener('click', () => {
    if (!currentMood) return alert('請先選擇心情！');
    loadSong(currentMood);
});

const changeBtn = document.getElementById('changeBtn');
changeBtn.addEventListener('click', () => {
    if (!currentMood) return alert('請先選擇心情！');
    loadSong(currentMood);
});

function loadSong(mood) {
    const songs = songList[mood];
    const pick = songs[Math.floor(Math.random() * songs.length)];

    document.getElementById('videoFrame').src = pick.video;
    document.getElementById('songInfo').innerHTML = `${pick.title}<br>${pick.artist}`;
    document.getElementById('lyricBox').textContent = pick.lyric;
}
</script>
</body>
</html>
