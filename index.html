<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情音樂推薦</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- 引導語 ＋ 心情 -->
        <div class="box guide-box">
            <p>引導語：今天想聽點什麼呢？</p>
            <p>心情： <span id="moodText">－</span></p>
        </div>

        <!-- 今日心情（輸入） -->
        <div class="box input-box">
            <input id="moodInput" type="text" placeholder="輸入今日心情...">
        </div>

        <!-- 按鈕 -->
        <div class="box button-box">
            <button id="sendBtn">送出</button>
        </div>

        <!-- MV 位置 -->
        <div class="box mv-box">
            <div id="mvArea">
                <!-- YouTube Iframe 會放在這 -->
            </div>
        </div>

        <!-- 歌曲資訊 -->
        <div class="box info-box">
            <p id="songInfo">歌曲資訊將顯示在這裡</p>
        </div>

        <!-- 換一首 -->
        <div class="box change-box">
            <button id="changeBtn">換一首</button>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
